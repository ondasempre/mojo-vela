[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sailwise-ref"
version = "0.1.0"
description = "SailWise reference implementation of the compute model (oracle + fallback backend)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
sailwise-ref = "sailwise_ref.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sailwise_ref"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/sailwise_ref"]
