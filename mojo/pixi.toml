[workspace]
authors = ["SailWise contributors"]
channels = ["https://conda.modular.com/max", "conda-forge"]
name = "sailwise-mojo"
platforms = ["linux-64", "osx-arm64"]
version = "0.1.0"
description = "SailWise compute core — scoring, ranking and window search in Mojo"

[dependencies]
# Pinned deliberately: Mojo is young and moves fast (risk R3 in docs/10-roadmap.md).
# Upgrade on purpose, in its own commit, with the golden tests as the safety net.
mojo = ">=1.0.0,<2"

[tasks]
demo = "mojo run -I src main.mojo"
test-units = "mojo run -I src tests/test_units.mojo"
test-wind = "mojo run -I src tests/test_wind.mojo"
test-score = "mojo run -I src -I tests tests/test_score.mojo"
test = { depends-on = ["test-units", "test-wind", "test-score"] }
build = "mojo build -I src main.mojo -o build/sailwise-demo"
fmt = "mojo format src tests main.mojo"
