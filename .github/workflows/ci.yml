name: CI

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python reference implementation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e './python[dev]'

      - name: Lint
        run: ruff check python/src python/tests scripts

      - name: Tests
        working-directory: python
        run: pytest -q --cov=sailwise_ref --cov-report=term-missing

      - name: Golden files are in sync with the reference
        run: python3 scripts/gen_golden.py --check

      - name: Mojo fixture matches the JSON fixture
        run: python3 scripts/check_fixture_sync.py

      - name: Reference demo runs
        working-directory: python
        run: PYTHONPATH=src python3 -m sailwise_ref.cli --all-profiles

  backend:
    name: API and adapters
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ./python -e './backend[dev]'
      - name: Lint
        run: ruff check backend/app backend/tests
      - name: Tests
        working-directory: backend
        run: pytest -q

  mojo:
    name: Mojo compute core
    runs-on: ubuntu-latest
    # The Mojo toolchain is young (risk R3): a toolchain failure must not block a
    # Python-only change. The job still runs on every push so regressions are visible.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install pixi
        run: |
          curl -fsSL https://pixi.sh/install.sh | sh
          echo "$HOME/.pixi/bin" >> "$GITHUB_PATH"

      - name: Install the pinned Mojo toolchain
        working-directory: mojo
        run: pixi install

      - name: Mojo version
        working-directory: mojo
        run: pixi run mojo --version

      - name: Tests (includes the cross-language golden check)
        working-directory: mojo
        run: pixi run test

      - name: Demo
        working-directory: mojo
        run: pixi run demo

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
